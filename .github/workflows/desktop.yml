# Builds the desktop app installers on GitHub's Mac, Windows and Linux machines.
# Download them from the "Artifacts" section of a run on the Actions tab.
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
name: Build desktop app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            os: macos-latest
            args: --mac --arm64
            files: dist/*.dmg
          - name: mac-intel
            os: macos-15-intel
            args: --mac --x64
            files: dist/*.dmg
          - name: windows
            os: windows-latest
            args: --win --x64
            files: dist/*.exe
          - name: linux
            os: ubuntu-latest
            args: --linux --x64
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Design-Library-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
