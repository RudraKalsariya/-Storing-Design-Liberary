# Builds the desktop app installers on GitHub's Mac, Windows and Linux machines.
# Download them from the "Artifacts" section of a run on the Actions tab.
# Each one is named Magpie-<version>-<mac|win|linux>-<arm64|x64>.
# Raising the version in package.json also publishes them as a GitHub Release.
# The Microsoft Store package (…-microsoft-store.appx) is only on the Actions run,
# for uploading in Partner Center.
name: Build desktop app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            os: macos-latest
            args: --mac --arm64
            files: dist/*.dmg
          - name: mac-intel
            os: macos-15-intel
            args: --mac --x64
            files: dist/*.dmg
          - name: windows
            os: windows-latest
            args: --win --x64
            files: dist/*.exe
          # The package you upload in Partner Center. The Store signs it, so it
          # isn't meant for installing directly and isn't attached to releases.
          - name: microsoft-store
            os: windows-latest
            args: --win appx --x64
            files: dist/*.appx
          - name: linux
            os: ubuntu-latest
            args: --linux --x64
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # Uploaded as the installer file itself (no zip), named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.files }}
          archive: false
          if-no-files-found: error

  # Publishes a GitHub Release whenever package.json has a version number that
  # hasn't been released yet (or when a vX.Y.Z tag is pushed by hand).
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/tags/$tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Magpie ${{ steps.version.outputs.tag }}
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.AppImage
          generate_release_notes: true
          body: |
            **Download the installer for your computer** from the list below:

            - `…-mac-arm64.dmg`: Macs with an M1, M2, M3 or M4 chip
            - `…-mac-x64.dmg`: Intel Macs
            - `…-win-x64.exe`: Windows

            Installing over an older version keeps your library and settings: they live outside the app.
            Upgrading from **Design Library** (Magpie's old name)? Your library and settings carry over. On a Mac, delete the old *Design Library* app from Applications afterwards.

            First launch on a Mac: if it says the app is damaged or can't be opened, run `xattr -cr "/Applications/Magpie.app"` in Terminal, then open it again.
            On Windows, if you see "Windows protected your PC", click **More info → Run anyway**.
