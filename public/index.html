<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23111'/></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="notice" class="notice" hidden></div>

    <header class="top">
      <a class="brand" href="#/">library</a>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" spellcheck="false" />
        <kbd>/</kbd>
      </label>
      <nav class="actions">
        <a class="link" href="#/folders" data-nav="folders">Folders</a>
        <button id="add" class="round" title="Add files (or just paste / drop anywhere)" aria-label="Add files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </nav>
    </header>

    <main id="main"></main>

    <div id="drop" class="drop" hidden><div>Drop to add to your library</div></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <input id="picker" type="file" multiple hidden />

    <div id="viewer" class="viewer" hidden>
      <button class="viewer-close round ghost" data-act="close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <button class="viewer-nav prev round ghost" data-act="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
      </button>
      <button class="viewer-nav next round ghost" data-act="next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
      </button>
      <div class="viewer-stage" data-act="close"></div>
      <aside class="viewer-panel"></aside>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
